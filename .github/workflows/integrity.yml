name: Static integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          python - <<'PY'
          import hashlib, json, pathlib
          registry = json.loads(pathlib.Path('HASH_REGISTRY.json').read_text(encoding='utf-8'))
          for name, expected in registry.items():
              actual = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if actual.lower() != expected.lower():
                  raise SystemExit(f'{name}: {actual} != {expected}')
          PY
